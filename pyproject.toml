[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaveforge"
version = "0.1.0"
description = "WeaveForge: Open-Source Real-Time 3D Moddable Action-to-GPU Physics Sandbox & Observational Crucible Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "David Stoler & Community Contributors"}
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "sympy>=1.13",
    "astropy>=6.1",
    "moderngl>=5.10",
    "glfw>=2.7",
    "PyOpenGL>=3.1.7",
    "imgui-bundle>=1.90",
    "wgpu>=0.18",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "psutil>=5.9",
    "camb>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
weaveforge = "weaveforge.__main__:main"

[tool.setuptools.packages.find]
include = ["weaveforge*"]

[tool.setuptools.package-data]
"weaveforge.data" = ["sparc/*.mrt", "*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
